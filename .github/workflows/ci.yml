# Continuous integration and deployment (SPEC 5.8).
# Every push and pull request: typecheck, lint, data lint, tests (incl. determinism, golden replays,
# performance floor, architecture guards) and a production build.
# Pushes to main additionally deploy the build to GitHub Pages - only if every check passed.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Data lint
        run: npm run lint:data
      - name: Tests (unit, determinism, golden replays, architecture)
        run: npm test
      # Timing tests run on their own, one file at a time: other test files on the same cores slow them down.
      - name: Performance floor
        run: npm run test:perf
      - name: Build
        run: npm run build
        env:
          TCS_BASE: /${{ github.event.repository.name }}/
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/app/dist

  # D3 F2 cross-browser hash probe: replays the shoot-out golden in Node, Chromium, Firefox and WebKit and
  # reports which checkpoints match. Report only: it never fails the run and neither check nor deploy needs it.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is not a project dependency (pinned here to the version the container has).
      - name: Install Playwright and browsers
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Probe
        run: npm run probe -- --diff
      - name: Step summary
        if: always()
        run: cat reports/probe-*.md >> "$GITHUB_STEP_SUMMARY" || echo "no probe report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: reports/probe-*.md
          if-no-files-found: warn

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
